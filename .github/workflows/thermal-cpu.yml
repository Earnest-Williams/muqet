name: CPU thermal reference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conservation-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and run self-contained numerical tests
        run: dotnet run --project tests/Muqet.Thermal.Tests/Muqet.Thermal.Tests.csproj --configuration Release
