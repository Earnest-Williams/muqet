name: CPU thermal and RimWorld adapter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conservation-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Numerical and thermostat regressions
        run: dotnet run --project tests/Muqet.Thermal.Tests/Muqet.Thermal.Tests.csproj --configuration Release
      - name: Room adapter regressions
        run: dotnet run --project tests/Muqet.Adapter.Tests/Muqet.Adapter.Tests.csproj --configuration Release
      - name: Compile native Waylith 1.7 adapter
        run: dotnet build src/Muqet.RimWorld/Muqet.RimWorld.csproj --configuration Release
      - name: Assert packaged assemblies exclude game and Harmony dependencies
        run: |
          test -s Mod/1.7/Assemblies/Muqet.RimWorld.dll
          test -s Mod/1.7/Assemblies/Muqet.Thermal.dll
          test ! -e Mod/1.7/Assemblies/0Harmony.dll
          test ! -e Mod/1.7/Assemblies/Assembly-CSharp.dll
          test ! -e Mod/1.7/Assemblies/Waylith.dll
